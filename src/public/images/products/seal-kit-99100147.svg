      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="nbrBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#f8fafc" rx="8" />
  <g stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4">
    <circle cx="200" cy="150" r="110" fill="none" />
  </g>
  <!-- Main 90mm Piston Seal Outer -->
  <circle cx="200" cy="140" r="85" fill="none" stroke="url(#puBlue)" stroke-width="14" />
