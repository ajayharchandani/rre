  <rect x="130" y="15" width="140" height="24" rx="4" fill="#0f172a" />
  <text x="200" y="31" fill="#38bdf8" font-size="11" font-family="monospace" font-weight="bold" text-anchor="middle">BOOM SEAL KIT · 991/00147</text>
  <text x="200" y="275" fill="#64748b" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">90mm Bore × 50mm Rod · 93 Shore A PU + NBR</text>
