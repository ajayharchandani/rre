  <circle cx="260" cy="140" r="45" fill="none" stroke="#f59e0b" stroke-width="8" />
  <!-- Dual POM Wear Strips -->
  <rect x="70" y="220" width="110" height="12" rx="4" fill="#94a3b8" stroke="#475569" stroke-width="1.5" />
  <rect x="220" y="220" width="110" height="12" rx="4" fill="#94a3b8" stroke="#475569" stroke-width="1.5" />
