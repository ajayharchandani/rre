<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="gearGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="70%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="#f8fafc" rx="8" />
  <!-- Bevel Ring Gear -->
  <circle cx="160" cy="150" r="95" fill="url(#gearGrad)" stroke="#0f172a" stroke-width="3" />
  <!-- Gear Teeth Serrations -->
  <circle cx="160" cy="150" r="90" fill="none" stroke="#94a3b8" stroke-width="8" stroke-dasharray="8 6" />
  <circle cx="160" cy="150" r="45" fill="#f8fafc" stroke="#0f172a" stroke-width="3" />
  <!-- Matched Pinion Gear -->
  <rect x="260" y="115" width="90" height="70" rx="6" fill="#334155" stroke="#0f172a" stroke-width="2" />
  <line x1="260" y1="125" x2="350" y2="125" stroke="#94a3b8" stroke-width="4" stroke-dasharray="6 4" />
  <line x1="260" y1="140" x2="350" y2="140" stroke="#94a3b8" stroke-width="4" stroke-dasharray="6 4" />
  <line x1="260" y1="155" x2="350" y2="155" stroke="#94a3b8" stroke-width="4" stroke-dasharray="6 4" />
  <line x1="260" y1="170" x2="350" y2="170" stroke="#94a3b8" stroke-width="4" stroke-dasharray="6 4" />
  <!-- Splined Pinion Shaft -->
  <rect x="350" y="130" width="30" height="40" fill="#64748b" stroke="#0f172a" stroke-width="2" />
  <rect x="110" y="15" width="180" height="24" rx="4" fill="#0f172a" />
  <text x="200" y="31" fill="#fbbf24" font-size="11" font-family="monospace" font-weight="bold" text-anchor="middle">CROWN WHEEL SET · 458/M1047</text>
  <text x="200" y="275" fill="#64748b" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">10×37 Tooth Ratio · Gleason Spiral Bevel (20MnCr5)</text>
</svg>